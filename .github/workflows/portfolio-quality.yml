name: Portfolio quality

on:
  push:
    branches:
      - design/midnight-mineral-v3
  pull_request:
    paths:
      - 'index.html'
      - 'case-study.html'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'docs/**'
      - 'package*.json'
      - '.github/workflows/portfolio-quality.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Tests, production build, browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scope npm dependency vulnerabilities (fail high-severity runtime findings)
        run: |
          npm audit --omit=dev --json > /tmp/portfolio-runtime-audit.json || true
          npm audit --json > /tmp/portfolio-all-audit.json || true
          node tests/audit-dependencies.mjs
      - name: Unit and content regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview -- --port 4173 > /tmp/portfolio-v3-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-v3-preview.log
          exit 1
      - name: Run Playwright interaction checks
        run: npm run test:smoke
      - name: Run accessibility and overflow checks
        run: npm run test:a11y
      - name: Capture real desktop/mobile browser layouts
        if: github.event_name == 'push'
        run: npm run capture
      - name: Upload UI screenshot evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-v3-visual-evidence
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
