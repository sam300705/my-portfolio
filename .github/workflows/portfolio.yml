name: Portfolio review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Select Playwright browser
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + require("@playwright/test").chromium.executablePath() + "\n")'
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            playwright-report
            test-results
          retention-days: 7
